<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectroMart - Order Confirmation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f6f9; padding: 30px; }
    .card { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #0d6efd; margin-bottom: 15px; }
    .item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    .total { text-align: right; font-weight: bold; font-size: 1.2rem; margin: 15px 0; }
    input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; }
    button { width: 100%; padding: 12px; background: #198754; color: white; border: none; border-radius: 5px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    button:disabled { background: #8fcaaa; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card">
    <h2>ElectroMart ⚡</h2>
    
    <div class="item">
      <span>Performance Laptop</span>
      <span>₹59,999</span>
    </div>

    <div class="total">Total: ₹59,999</div>

    <label for="userEmail">Enter your email for invoice:</label>
    <input type="email" id="userEmail" value="bhavishywanicricket@gmail.com" placeholder="Email enter karein..." required />

    <button type="button" id="placeOrderBtn" onclick="sendOrderReceipt()">Place Order & Send Receipt ⚡</button>
  </div>

  <script>
    async function sendOrderReceipt() {
      const emailInput = document.getElementById('userEmail').value;
      const btn = document.getElementById('placeOrderBtn');

      if (!emailInput) {
        alert("Kripya email enter karein!");
        return;
      }

      btn.innerText = "Sending Email...";
      btn.disabled = true;

      try {
        const response = await fetch('https://electromart-backend-06rr.onrender.com/send-receipt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: emailInput,
            total: 59999
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          alert("Success! Order Receipt Email Par Bhej Di Gayi Hai.");
        } else {
          alert("Error: " + (data.error || "Failed to send email"));
        }
      } catch (err) {
        console.error("Fetch Error:", err);
        alert("Server se connection nahi ho pa raha hai.");
      } finally {
        btn.innerText = "Place Order & Send Receipt ⚡";
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
